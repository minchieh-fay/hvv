name: Build hvv

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
            platform: darwin/amd64
            archive: hvv-macos-intel.zip
          - name: macOS arm64
            runner: macos-14
            platform: darwin/arm64
            archive: hvv-macos-arm64.zip
          - name: Windows x86-64
            runner: windows-2022
            platform: windows/amd64
            archive: hvv-windows-x86-64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build macOS application
        if: runner.os == 'macOS'
        run: wails build -clean -platform "${{ matrix.platform }}"

      - name: Package macOS application
        if: runner.os == 'macOS'
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: ditto -c -k --sequesterRsrc --keepParent build/bin/hvv.app "$ARCHIVE"

      - name: Build Windows application
        if: runner.os == 'Windows'
        run: wails build -clean -platform "${{ matrix.platform }}"

      - name: Package Windows application
        if: runner.os == 'Windows'
        env:
          ARCHIVE: ${{ matrix.archive }}
        shell: pwsh
        run: Compress-Archive -Path build/bin/hvv.exe -DestinationPath $env:ARCHIVE

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hvv-*.zip
          path: release-files
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-files/*.zip \
          --repo "${{ github.repository }}" \
          --generate-notes \
          --title "${{ github.ref_name }}"

      - name: Keep only the latest three releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old_tags=$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName,publishedAt \
            --jq 'map(select(.tagName | startswith("v")))
              | sort_by(.publishedAt) | reverse | .[3:] | .[].tagName')

          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              gh release delete "$tag" \
                --repo "${{ github.repository }}" \
                --cleanup-tag \
                --yes
            fi
          done <<< "$old_tags"
